"$schema" = 'https://starship.rs/config-schema.json'

# Insert a blank line before each prompt.
add_newline = true
scan_timeout = 30
palette = 'gruvbox_dark'

format = """
[](fg:color_orange)\
$os\
$username\
[](fg:color_orange bg:color_yellow)\
$directory\
[](fg:color_yellow bg:color_aqua)\
$git_branch\
$git_status\
$git_commit\
$git_state\
$hg_branch\
[](fg:color_aqua bg:color_blue)\
$hostname\
$shlvl\
$kubernetes\
$c\
$package\
$cmake\
$dart\
$dotnet\
$elixir\
$elm\
$erlang\
$golang\
$kotlin\
$haskell\
$helm\
$java\
$julia\
$nim\
$nodejs\
$ocaml\
$perl\
$php\
$purescript\
$python\
$ruby\
$rust\
$swift\
$terraform\
$zig\
$nix_shell\
$conda\
$aws\
$gcloud\
$crystal\
[](fg:color_blue bg:color_bg3)\
$docker_context\
$env_var\
$custom\
[](fg:color_bg3 bg:color_bg1)\
$memory_usage\
$jobs\
$status\
$cmd_duration\
$time\
$battery\
[](fg:color_bg1) \
$line_break\
$character"""

[palettes.gruvbox_dark]
color_fg0 = '#fbf1c7'
color_bg1 = '#3c3836'
color_bg3 = '#665c54'
color_blue = '#458588'
color_aqua = '#689d6a'
color_green = '#98971a'
color_orange = '#d65d0e'
color_purple = '#b16286'
color_red = '#cc241d'
color_yellow = '#d79921'

[os]
disabled = false
style = 'fg:color_fg0 bg:color_orange'
format = '[$symbol]($style)'

[os.symbols]
Windows = '󰍲'
Ubuntu = '󰕈'
SUSE = ''
Raspbian = '󰐿'
Mint = '󰣭'
Macos = '󰀵'
Manjaro = ''
Linux = '󰌽'
Gentoo = '󰣨'
Fedora = '󰣛'
Alpine = ''
Amazon = ''
Android = ''
Arch = '󰣇'
Artix = '󰣇'
CentOS = ''
Debian = '󰣚'
Redhat = '󱄛'
RedHatEnterprise = '󱄛'

[username]
disabled = false
show_always = true
style_user = 'fg:color_fg0 bg:color_orange'
style_root = 'bold fg:color_bg1 bg:color_orange'
format = '[ $user ]($style)'
aliases = { 'adrian.grimm' = 'adrian' }

[directory]
truncation_length = 4
truncate_to_repo = true
truncation_symbol = '…/'
style = 'fg:color_fg0 bg:color_yellow'
format = '[ $path ]($style)'

[directory.substitutions]
Documents = '󰈙 '
Downloads = ' '
Music = '󰝚 '
Pictures = ' '
Developer = '󰲋 '

[git_branch]
disabled = false
only_attached = false
ignore_branches = []
symbol = ' '
style = 'fg:color_fg0 bg:color_aqua'
format = '[ $symbol $branch ]($style)'

[git_status]
disabled = false
conflicted = ''
deleted = '󰆴'
ahead = '⇡${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
behind = '⇣${count}'
staged = '[\($count\)](bold fg:color_green bg:color_aqua)'
stashed = '[\($count\)](bold fg:color_yellow bg:color_aqua)'
modified = '[\($count\)](bold fg:color_red bg:color_aqua)'
renamed = 'renamed'
style = 'fg:color_fg0 bg:color_aqua'
format = '[($all_status$ahead_behind )]($style)'

[git_commit]
commit_hash_length = 7
only_detached = true
style = 'fg:color_fg0 bg:color_aqua'
format = '[ \($hash\) ]($style)'

[git_state]
cherry_pick = ' PICKING'
style = 'fg:color_fg0 bg:color_aqua'
format = '[ $state( $progress_current/$progress_total) ]($style)'

[hg_branch]
disabled = true
symbol = ' '
style = 'fg:color_fg0 bg:color_aqua'
format = '[ $symbol$branch ]($style)'

[hostname]
ssh_only = true
trim_at = '.'
style = 'fg:color_fg0 bg:color_blue'
format = '[ ⟪ $hostname⟫ ]($style)'

[shlvl]
disabled = false
symbol = ' '
threshold = 3
style = 'fg:color_fg0 bg:color_blue'
format = '[ $symbol$shlvl ]($style)'

[kubernetes]
disabled = false
symbol = '☸ '
style = 'fg:color_fg0 bg:color_blue'
format = '[ $symbol$context( \($namespace\)) ]($style)'

[[kubernetes.contexts]]
context_pattern = 'dev\.local\.cluster\.k8s'
context_alias = 'dev'

[c]
symbol = ' '
style = 'fg:color_fg0 bg:color_blue'
format = '[ $symbol($version) ]($style)'

[package]
symbol = '󰏗 '
style = 'fg:color_fg0 bg:color_blue'
format = '[ $symbol($version) ]($style)'

[cmake]
style = 'fg:color_fg0 bg:color_blue'
format = '[ $symbol($version) ]($style)'

[dart]
style = 'fg:color_fg0 bg:color_blue'
format = '[ $symbol($version) ]($style)'

[dotnet]
symbol = '•NET '
heuristic = true
style = 'fg:color_fg0 bg:color_blue'
format = '[ $symbol($version) ]($style)'

[elixir]
symbol = ' '
style = 'fg:color_fg0 bg:color_blue'
format = '[ $symbol($version) ]($style)'

[elm]
symbol = ' '
style = 'fg:color_fg0 bg:color_blue'
format = '[ $symbol($version) ]($style)'

[erlang]
style = 'fg:color_fg0 bg:color_blue'
format = '[ $symbol($version) ]($style)'

[golang]
symbol = ' '
style = 'fg:color_fg0 bg:color_blue'
format = '[ $symbol($version) ]($style)'

[kotlin]
symbol = ' '
style = 'fg:color_fg0 bg:color_blue'
format = '[ $symbol($version) ]($style)'

[haskell]
symbol = ' '
style = 'fg:color_fg0 bg:color_blue'
format = '[ $symbol($version) ]($style)'

[helm]
style = 'fg:color_fg0 bg:color_blue'
format = '[ $symbol($version) ]($style)'

[java]
symbol = ' '
style = 'fg:color_fg0 bg:color_blue'
format = '[ $symbol($version) ]($style)'

[julia]
symbol = ' '
style = 'fg:color_fg0 bg:color_blue'
format = '[ $symbol($version) ]($style)'

[nim]
symbol = '󰆥 '
style = 'fg:color_fg0 bg:color_blue'
format = '[ $symbol($version) ]($style)'

[nodejs]
symbol = ' '
style = 'fg:color_fg0 bg:color_blue'
format = '[ $symbol($version) ]($style)'

[ocaml]
style = 'fg:color_fg0 bg:color_blue'
format = '[ $symbol($version) ]($style)'

[perl]
symbol = ' '
style = 'fg:color_fg0 bg:color_blue'
format = '[ $symbol($version) ]($style)'

[php]
symbol = ' '
style = 'fg:color_fg0 bg:color_blue'
format = '[ $symbol($version) ]($style)'

[purescript]
style = 'fg:color_fg0 bg:color_blue'
format = '[ $symbol($version) ]($style)'

[python]
symbol = ' '
pyenv_version_name = false
pyenv_prefix = 'pyenv '
style = 'fg:color_fg0 bg:color_blue'
format = '[ $symbol($version)( \($virtualenv\)) ]($style)'

[ruby]
symbol = ' '
style = 'fg:color_fg0 bg:color_blue'
format = '[ $symbol($version) ]($style)'

[rust]
symbol = ' '
style = 'fg:color_fg0 bg:color_blue'
format = '[ $symbol($version) ]($style)'

[swift]
symbol = ' '
style = 'fg:color_fg0 bg:color_blue'
format = '[ $symbol($version) ]($style)'

[terraform]
style = 'fg:color_fg0 bg:color_blue'
format = '[ $symbol($version) ]($style)'

[zig]
style = 'fg:color_fg0 bg:color_blue'
format = '[ $symbol($version) ]($style)'

[crystal]
style = 'fg:color_fg0 bg:color_blue'
format = '[ $symbol($version) ]($style)'

[nix_shell]
symbol = ' '
style = 'fg:color_fg0 bg:color_blue'
format = '[ $symbol$state( $name) ]($style)'

[conda]
symbol = ' '
style = 'fg:color_fg0 bg:color_blue'
format = '[ $symbol$environment ]($style)'

[aws]
symbol = ' '
style = 'fg:color_fg0 bg:color_blue'
format = '[ $symbol($profile)( \($region\)) ]($style)'

[aws.region_aliases]
ap-southeast-2 = 'au'
us-east-1 = 'va'

[gcloud]
symbol = '☁ '
style = 'fg:color_fg0 bg:color_blue'
format = '[ $symbol$account(@$domain)( \($region\)) ]($style)'

[gcloud.region_aliases]
us-central1 = 'uc1'
asia-northeast1 = 'an1'

[docker_context]
symbol = ' '
style = 'fg:color_fg0 bg:color_bg3'
format = '[ $symbol$context ]($style)'

[env_var]
disabled = true
variable = 'SHELL'
symbol = ''
default = 'unknown shell'
style = 'fg:color_fg0 bg:color_bg3'
format = '[ $env_value ]($style)'

[singularity]
# Not displayed unless $singularity is added to the top-level format.
style = 'fg:color_fg0 bg:color_bg3'
format = '[ $symbol$env ]($style)'

[memory_usage]
disabled = false
threshold = 85
symbol = '󰍛 '
style = 'bold fg:color_fg0 bg:color_bg1'
format = '[ $symbol${ram}( | ${swap}) ]($style)'

[jobs]
disabled = false
symbol = '✦ '
symbol_threshold = 1
number_threshold = 1
style = 'bold fg:color_fg0 bg:color_bg1'
format = '[ $symbol$number ]($style)'

[status]
disabled = false
symbol = ' '
style = 'bold fg:color_red bg:color_bg1'
format = '[ $symbol$status ]($style)'

[cmd_duration]
min_time = 2000
show_milliseconds = false
style = 'bold fg:color_fg0 bg:color_bg1'
format = '[ took $duration ]($style)'

[time]
disabled = false
use_12hr = false
utc_time_offset = 'local'
time_format = '%T'
style = 'fg:color_fg0 bg:color_bg1'
format = '[  $time ]($style)'

[battery]
full_symbol = '󰁹'
charging_symbol = '󰂄'
discharging_symbol = '󰂃'
format = '[ $symbol$percentage ]($style)'

[[battery.display]]
threshold = 10
style = 'bold fg:color_red bg:color_bg1'

[[battery.display]]
threshold = 30
style = 'fg:color_yellow bg:color_bg1'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[❯](bold fg:color_green)'
error_symbol = '[✖](bold fg:color_red)'
vimcmd_symbol = '[ ❮](bold fg:color_green)'
vimcmd_replace_one_symbol = '[❮](bold fg:color_purple)'
vimcmd_replace_symbol = '[❮](bold fg:color_purple)'
vimcmd_visual_symbol = '[❮](bold fg:color_yellow)'
