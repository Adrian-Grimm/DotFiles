"$schema" = 'https://starship.rs/config-schema.json'

# Don't print a new line at the start of the prompt
add_newline = true

# Wait 10 milliseconds for starship to check files under the current directory.
scan_timeout = 10

# Overwrite a default_prompt_order and  use custom prompt_order
format = """
[](color_orange)\
$os\
$username\
[](bg:color_yellow fg:color_orange)\
$directory\
[](fg:color_yellow bg:color_aqua)\
$git_branch\
$git_status\
$git_commit\
$git_state\
[](fg:color_aqua bg:color_blue)\
$c\
$hostname\
$shlvl\
$kubernetes\
$hg_branch\
$docker_context\
$package\
$cmake\
$dart\
$dotnet\
$elixir\
$elm\
$erlang\
$golang\
$kotlin\
$haskell\
$helm\
$java\
$julia\
$nim\
$nodejs\
$ocaml\
$perl\
$php\
$purescript\
$python\
$ruby\
$rust\
$swift\
$terraform\
$zig\
$nix_shell\
$conda\
$aws\
$gcloud\
$crystal\
[](fg:color_blue bg:color_bg3)\
$docker_context\
$env_var\
$custom\
[](fg:color_bg3 bg:color_bg1)\
$memory_usage\
$jobs\
$status\
$cmd_duration\
$time\
$battery\
[ ](fg:color_bg1)\
$line_break$character"""

palette = 'gruvbox_dark'

[palettes.gruvbox_dark]
color_fg0 = '#fbf1c7'
color_bg1 = '#3c3836'
color_bg3 = '#665c54'
color_blue = '#458588'
color_aqua = '#689d6a'
color_green = '#98971a'
color_orange = '#d65d0e'
color_purple = '#b16286'
color_red = '#cc241d'
color_yellow = '#d79921'

[aws]
format = "on [$symbol$profile(\\($region\\))]($style) "
style = "bold blue"
symbol = " "
[aws.region_aliases]
ap-southeast-2 = "au"
us-east-1 = "va"

[battery]
full_symbol = ""
charging_symbol = ""
discharging_symbol = ""
format = "[$symbol](bold dimmed fg:color_green bg:color_bg1)"

[c]
symbol = " "
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[character]
# The name of the module we are configuring is "character"
disabled = false
success_symbol = '[❯](bold fg:color_green)'
error_symbol = '[✖](bold fg:color_red)'
vimcmd_symbol = '[ ❮](bold fg:color_green)'
vimcmd_replace_one_symbol = '[❮](bold fg:color_purple)'
vimcmd_replace_symbol = '[❮](bold fg:color_purple)'
vimcmd_visual_symbol = '[❮](bold fg:color_yellow)'

[conda]
symbol = " "
format = "[$symbol$environment](dimmed green) "
# Replace the "❯" symbol in the prompt with "➜"

[cmd_duration]
disabled = false
min_time = 2000
show_milliseconds = false
format = "[took $duration]($style)"
style = "bold dimmed bg:color_bg1"

[directory]
disabled = false
truncation_length = 4
truncate_to_repo = true
style = "fg:color_fg0 bg:color_yellow"
format = "[ $path ]($style)"
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[dotnet]
symbol = "•NET"
heuristic = true
style = "fg:color_fg0 bg:color_blue"
format = '[ $symbol( $version) ]($style)'

[docker_context]
symbol = ""
style = "fg:#83a598 bg:color_bg3"
format = '[ $symbol( $context) ]($style)'

[elixir]
symbol = " "
style = "fg:#83a598 bg:color_bg3"
format = '[ $symbol( $context) ]($style)'

[elm]
symbol = " "
style = "fg:#83a598 bg:color_bg3"
format = '[ $symbol( $context) ]($style)'

[env_var]
disabled = true
variable = "SHELL"
symbol = ""
default = "unknown shell"
style = "dimmed bg:color_bg3"
format = "[with $env_value]($style) "

[gcloud]
symbol = "️🇬️ "
[gcloud.region_aliases]
us-central1 = "uc1"
asia-northeast1 = "an1"

[git_branch]
symbol = " " # ""
style = "fg:color_fg0 bg:color_aqua"
format = '[ $symbol $branch ]($style)'

[git_commit]
commit_hash_length = 7
style = "bg:color_aqua"
format = "[\\($hash\\)]($style) "

[git_state]
cherry_pick = " PICKING"
disabled = false
style = "fg:color_fg0 bg:color_aqua"
format = '[($all_status$ahead_behind )]($style)'

[git_status]
disabled = false
conflicted = ""
deleted = ""
ahead = "⇡${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
behind = "⇣${count}"
staged = '[\($count\)](bold color_green bg:color_aqua)'
stashed = '[\($count\)](bold color_yellow bg:color_aqua)'
modified = '[\($count\)](bold color_red bg:color_aqua)'
renamed = "renamed"
style = "fg:#769ff0 bg:color_aqua"
format = '[($all_status$ahead_behind )]($style)'

[golang]
symbol = ""
style = "fg:color_fg0 bg:color_blue"
format = '[ $symbol( $version) ]($style)'

[hg_branch]
symbol = " "

[hostname]
ssh_only = true
format = "[⟪ $hostname⟫ in ]($style)"
style = "bg:color_blue"
trim_at = "."
disabled = false

[kotlin]
symbol = ""
style = "fg:color_fg0 bg:color_blue"
format = '[ $symbol( $version) ]($style)'

[kubernetes]
symbol = "☸ "
format = "on [$symbol$context \\($namespace\\)](dimmed green) "
disabled = false
[kubernetes.context_aliases]
"dev.local.cluster.k8s" = "dev"
style = "fg:#83a598 bg:color_bg3"
format = '[ $symbol( $context) ]($style)'

[haskell]
symbol = ""
style = "fg:color_fg0 bg:color_blue"
format = '[ $symbol( $version) ]($style)'

[jobs]
disabled = false
symbol = "✦ "
threshold = 1
format = "[$symbol$number]($style) "
style = "bold dimmed bg:color_bg1"

[java]
symbol = " "
style = "fg:color_fg0 bg:color_blue"
format = '[ $symbol( $version) ]($style)'

[julia]
symbol = " "
style = "fg:#83a598 bg:color_bg3"
format = '[ $symbol( $context) ]($style)'

[line_break]
disabled = false

[memory_usage]
disabled = false
threshold = 75
symbol = "󰍛"
#"䷀ "
style = "bold dimmed bg:color_bg1"
format = '[$symbol ${ram}( | ${swap})]($style)'

[nim]
symbol = " "
style = "fg:#83a598 bg:color_bg3"
format = '[ $symbol( $context) ]($style)'

[nix_shell]
symbol = " "
style = "fg:#83a598 bg:color_bg3"
format = '[ $symbol( $context) ]($style)'

[nodejs]
symbol = ""
style = "fg:color_fg0 bg:color_blue"
format = '[ $symbol( $version) ]($style)'

[os]
disabled = false
style = "bg:color_orange fg:color_fg0"
format = '[$symbol]($style)'

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[package]
symbol = " "
format = "via [$symbol $version](208 bold) "

[perl]
symbol = " "
style = "fg:#83a598 bg:color_bg3"
format = '[ $symbol( $context) ]($style)'

[php]
symbol = ""
style = "fg:color_fg0 bg:color_blue"
format = '[ $symbol( $version) ]($style)'

[python]
symbol = " "
pyenv_version_name = false
pyenv_prefix = "pyenv "
style = "fg:color_fg0 bg:color_blue"
format = '[ $symbol( $version) ]($style)'

[ruby]
symbol = " "
style = "fg:#83a598 bg:color_bg3"
format = '[ $symbol( $context) ]($style)'

[rust]
symbol = ""
style = "fg:color_fg0 bg:color_blue"
format = '[ $symbol( $version) ]($style)'

[shlvl]
disabled = false
symbol = ""
style = "fg:color_fg0 bg:color_blue"
format = '[ $symbol ( $shlvl )]($style)'
threshold = 3

[singularity]
style = "fg:#83a598 bg:color_bg3"
format = '[ $symbol( $context) ]($style)'

[status]
disabled = false
symbol = " "
style = "bold fg:color_red bg:color_bg1"
format = '[$symbol( $status)]($style)'

[swift]
symbol = "ﯣ "
style = "fg:#83a598 bg:color_bg3"
format = '[ $symbol( $context) ]($style)'

[time]
disabled = false
use_12hr = false
utc_time_offset = "local"
time_format = "%T" # "   %D"
style = "bg:color_bg1"
format = '[[  $time ](fg:color_fg0 bg:color_bg1)]($style)'

[username]
disabled = false
show_always = true
style_user = "bg:color_orange fg:color_fg0"
style_root = "bg:color_orange fg:color_fg0"
format = '[ $user ]($style)'